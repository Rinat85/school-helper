<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Класс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --fg: var(--tg-theme-text-color, #000);
    --muted: var(--tg-theme-hint-color, #707579);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --accent: var(--tg-theme-link-color, #2481cc);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 13px; }
  .big { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .bar { height: 8px; border-radius: 4px; background: rgba(128,128,128,.25); overflow: hidden; margin: 8px 0 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .err { color: #d33; }
</style>
</head>
<body>
<h1 id="title">Класс</h1>
<div class="sub" id="who">загрузка…</div>
<div id="content"></div>

<script>
// Заглушка этапа 1: проверяет, что цепочка initData -> роль из БД работает.
// Настоящий Mini App — этап 2 (SPEC §7).
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const money = n => new Intl.NumberFormat('ru-RU').format(n) + ' сум';

async function api(path) {
  const res = await fetch(path, {
    headers: { Authorization: 'tma ' + (tg?.initData || '') }
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
  return res.json();
}

(async () => {
  const content = document.getElementById('content');
  try {
    const me = await api('/api/me');
    document.getElementById('title').textContent =
      [me.class.name, me.class.school].filter(Boolean).join(' · ');
    document.getElementById('who').textContent =
      me.person.name + ' · ' + me.roles.map(r => ({
        parent: 'родитель', treasurer: 'казначей', chair: 'председатель',
        auditor: 'ревизор', teacher: 'учитель', admin: 'админ'
      }[r] || r)).join(', ');

    const mine = await api('/api/money/mine');
    const pending = mine.filter(m => m.status === 'pending' || m.status === 'claimed');
    if (pending.length) {
      content.insertAdjacentHTML('beforeend',
        '<div class="card"><div class="label">Что от вас ждут</div>' +
        pending.map(m => `<div class="row"><span>${m.title}</span><b>${money(m.expected)}</b></div>`).join('') +
        '</div>');
    }

    if (me.sees_money) {
      const s = await api('/api/money/summary');
      content.insertAdjacentHTML('beforeend',
        `<div class="card"><div class="label">Касса класса</div>
         <div class="big">${money(s.balance)}</div>
         <div class="row"><span class="label">Поступило</span><span>${money(s.inflow)}</span></div>
         <div class="row"><span class="label">Потрачено</span><span>${money(s.outflow)}</span></div></div>` +
        s.collections.map(c => `
          <div class="card"><b>${c.title}</b>
            <div class="bar"><i style="width:${Math.min(100, c.percent)}%"></i></div>
            <div class="label">${money(c.collected)} из ${money(c.target)} · ${c.percent}%</div>
          </div>`).join('')
      );
    }
  } catch (e) {
    content.innerHTML = `<div class="card err">Не удалось загрузить: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
