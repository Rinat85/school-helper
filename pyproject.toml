[project]
name = "school-helper"
version = "0.1.0"
description = "Telegram-бот и Mini App для родительского комитета класса"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    # На Windows у zoneinfo нет системной базы часовых поясов.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schoolhelper = ["storage/*.sql"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Depends() в аргументах по умолчанию — штатная идиома FastAPI, не ошибка.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest выставляет окружение до импорта пакета — иначе config его не увидит.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
