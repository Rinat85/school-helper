# Прод: готовый образ из GHCR, собранный в GitHub Actions.
# Локальная сборка — docker-compose.dev.yml (на VPS не собираем, там мало памяти).
services:
  school-helper:
    image: ghcr.io/rinat85/school-helper:${IMAGE_TAG:-latest}
    container_name: school-helper
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/school.db
      LOG_DIR: /app/data/logs
    volumes:
      # База и логи переживают пересборку образа — это единственное,
      # что нельзя потерять при деплое.
      - ./data:/app/data
    ports:
      # Наружу не торчит: снаружи только Caddy, и только когда появится домен.
      - "127.0.0.1:8080:8080"
    # Сосед по машине не должен уметь утащить всю память: на этом VPS
    # 1.9 ГБ на всё, и одна протечка кладёт остальные сервисы в своп.
    mem_limit: 256m
    healthcheck:
      # curl в slim-образе нет, проверяем питоном.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys,json;\
              d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5));\
              sys.exit(0 if d.get('ok') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
